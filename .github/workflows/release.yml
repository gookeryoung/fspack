name: Release

# 触发：push v*.*.* tag
#
# 三个 job 组：
#   - pypi        : uv build → uv publish（OIDC）→ 上传 sdist/wheel artifact
#   - pack-windows: windows-latest 原生打包 fspack 自身（mingw + NSIS），
#                   按 Python 版本矩阵逐格并行（3.8–3.14，python.org embed）
#   - pack-linux  : ubuntu-latest  原生打包 fspack 自身（gcc + dpkg-dev），
#                   按 Python 版本矩阵逐格并行（3.10–3.14，standalone）
#
# 矩阵是显式列表，与 [tool.fspack] python-versions 及运行时资产表对齐：
# Linux/macOS 的 python-build-standalone 没有 3.8/3.9 资产，这两版只在 Windows 发布。
# 每格显式传 --py-version，产物落在该格自己的 dist 根（不走配置的多版本
# dist/py<ver>/ 布局）；发行包文件名已含 py<完整版本>，各格产物汇总到同一个
# GitHub Release 不会重名。矩阵漂移由 tests/test_release_workflow.py 守护。
#
# release job 依赖以上 job，收集构建产物（exe/deb/tar.gz/zip）+
# PyPI 产物（whl/sdist），统一上传到 GitHub Release。
# 任一前置 job 失败时 release 仍尝试发布已成功产物，但最终标记 workflow 失败。

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===== PyPI 发布 =====
  pypi:
    name: Build & Publish PyPI
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI (OIDC)
        run: uv publish

      - name: Upload sdist & wheel artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pypi-dist
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # ===== Windows 原生打包（用 fspack 打包 fspack 自身，每个 Python 版本一格）=====
  pack-windows:
    name: Pack (Windows native, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.8–3.14 与 KNOWN_EMBED_VERSIONS 对齐（tests/test_release_workflow.py 守护）
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # windows-2025 镜像移除了 NSIS；mingw-w64 提供 x86_64-w64-mingw32-gcc 前缀的交叉编译器。
      # 注意：windows-latest 默认 shell 是 pwsh，PowerShell 访问环境变量必须用 $env: 前缀，
      # 直接写 $GITHUB_PATH 会被当作 PowerShell 变量（值为 $null），PATH 不会写入文件，
      # 导致后续步骤找不到 makensis。Add-Content 在 pwsh 7 下默认 utf8NoBOM 编码安全。
      - name: Install NSIS & mingw-w64
        shell: pwsh
        run: |
          choco install nsis mingw -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\mingw-w64\mingw64\bin"

      - name: Sync dependencies
        run: uv sync --frozen

      # fspack 的 download_wheels 用 `pip download` 拉 wheel，但 uv 管理的 venv 默认不含 pip，
      # 且 CI runner 上 PATH 中可能没有带 pip 的系统 python，故显式安装 pip 到 venv。
      - name: Install pip
        run: uv pip install pip

      - name: Cache fspack assets
        uses: actions/cache@v5
        with:
          path: ~/.fspack/cache/
          # 运行时归档与 wheel 按 Python 版本区分，缓存键必须含版本，否则各格
          # 争抢同一个键、只有第一格能写入
          key: fspack-windows-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            fspack-windows-py${{ matrix.python-version }}-
            fspack-windows-

      - name: Build fspack with fspack
        env:
          PYTHONIOENCODING: utf-8
        run: uv run fspack b . --target windows --py-version ${{ matrix.python-version }}

      - name: Generate installer
        env:
          PYTHONIOENCODING: utf-8
        run: uv run fspack p . --target windows --format all --no-build --py-version ${{ matrix.python-version }}

      - name: Smoke test (version)
        run: ./dist/fspack.exe -V

      - name: Assert artifacts
        shell: bash
        run: |
          test -f dist/release/fspack-*-windows-*-setup.exe
          test -f dist/release/fspack-*-windows-*.zip

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pack-windows-py${{ matrix.python-version }}-failure
          path: dist/
          retention-days: 3

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-py${{ matrix.python-version }}
          path: dist/release/
          retention-days: 7
          if-no-files-found: error

  # ===== Linux 原生打包（用 fspack 打包 fspack 自身，每个 Python 版本一格）=====
  pack-linux:
    name: Pack (Linux native, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.10–3.14 与 KNOWN_STANDALONE_VERSIONS 对齐：3.8/3.9 无上游运行时资产
        # （tests/test_release_workflow.py 守护）
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc dpkg-dev

      - name: Sync dependencies
        run: uv sync --frozen

      # fspack 的 download_wheels 用 `pip download` 拉 wheel，但 uv 管理的 venv 默认不含 pip，
      # 且 CI runner 上 PATH 中可能没有带 pip 的系统 python，故显式安装 pip 到 venv。
      - name: Install pip
        run: uv pip install pip

      - name: Cache fspack assets
        uses: actions/cache@v5
        with:
          path: ~/.fspack/cache/
          # 同 Windows：运行时归档按 Python 版本区分，缓存键必须含版本
          key: fspack-linux-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            fspack-linux-py${{ matrix.python-version }}-
            fspack-linux-

      - name: Build fspack with fspack
        run: uv run fspack b . --target linux --py-version ${{ matrix.python-version }}

      - name: Generate installer
        run: uv run fspack p . --target linux --format all --no-build --py-version ${{ matrix.python-version }}

      - name: Smoke test (version)
        run: ./dist/fspack -V

      - name: Assert artifacts
        run: |
          test -f dist/release/fspack-*-linux-*.tar.gz
          test -f dist/release/fspack_*-slim_amd64.deb
          test -f dist/release/fspack-*-linux-*.zip

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pack-linux-py${{ matrix.python-version }}-failure
          path: dist/
          retention-days: 3

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: release-linux-py${{ matrix.python-version }}
          path: dist/release/
          retention-days: 7
          if-no-files-found: error

  # ===== 收集产物并上传到 GitHub Release =====
  release:
    name: Upload to GitHub Release
    needs: [pypi, pack-windows, pack-linux]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets/

      - name: Collect release files
        run: |
          mkdir -p release-files/
          # 构建产物（exe/deb/tar.gz/zip）+ PyPI 产物（whl/sdist）
          # sdist 也是 .tar.gz，但命名 fspack-<version>.tar.gz 不与 Linux 便携包冲突
          find release-assets/ -type f \
            \( -name "*.exe" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.whl" \) \
            -exec cp {} release-files/ \;
          echo "::group::Release files"
          ls -la release-files/
          echo "::endgroup::"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        # 幂等：release 已存在则上传产物（--clobber 覆盖同名 asset），不存在则创建。
        # 处理重打 tag 触发 release.yml 时上一次 run 已创建 release 的冲突场景。
        # release job 无 actions/checkout（无 .git 目录），gh 无法从 git remote 推断
        # owner/repo，必须用 GH_REPO 环境变量显式指定仓库。
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME 已存在，上传产物（覆盖同名 asset）..."
            gh release upload "$TAG_NAME" release-files/* --clobber
          else
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --generate-notes \
              release-files/*
          fi

      - name: Report failure (if any upstream job failed)
        if: contains(needs.pypi.result, 'failure') || contains(needs.pack-windows.result, 'failure') || contains(needs.pack-linux.result, 'failure')
        run: |
          echo "::error::部分 job 失败（pypi=${{ needs.pypi.result }} windows=${{ needs.pack-windows.result }} linux=${{ needs.pack-linux.result }}），已成功的产物已上传到 Release。"
          exit 1
