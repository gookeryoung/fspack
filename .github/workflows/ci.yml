name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen --extra lint

      # 依赖漏洞审计：仅导出运行时依赖（--no-dev 排除 dev/docs/image extras），
      # 开发工具链（pytest/sphinx/Pillow 等）漏洞不影响最终用户，且新版本均要求
      # Python >=3.10，与项目仍支持 3.8 的矩阵不兼容。
      # fspack 运行时依赖仅 certifi/pefile/rich/pygments，已全部修复至安全版本。
      - name: Dependency vulnerability audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/audit-requirements.txt
          uvx pip-audit --strict -r /tmp/audit-requirements.txt

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Pyrefly check
        run: uv run pyrefly check

  # ===== 单元测试矩阵：ubuntu + windows + macos × Python 3.8-3.14 =====
  # Windows 矩阵覆盖 Windows 路径处理、PATH 分隔符、注册表访问等平台特有逻辑
  # macOS 矩阵验证 MacLoader/clang 检测、detect_platform 的 Darwin 分支与
  # doctor 的 MACOS 工具检查链路（req-04 macOS 运行时支持）
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # 缓存写冲突修复：每个 OS 只允许一个 writer
          # ubuntu 由 lint job 独占写入，test 矩阵全部只读
          # windows/macos 无独立 lint job，由 Python 3.10 行负责写入
          save-cache: ${{ matrix.os != 'ubuntu-latest' && matrix.python-version == '3.10' }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      - name: Run tests
        env:
          # Windows 默认控制台编码（cp1252/cp936）无法编码中文日志字符，
          # _compat.py 的 CICompat.ensure_utf8_stdio 只重配置 pytest 捕获流，
          # pytest 回放失败输出到真实 stdout/stderr 时仍触发 UnicodeEncodeError。
          # 强制 UTF-8 确保 CI 日志与本地非交互终端均可正常输出中文。
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: uv run pytest -m "not slow" --cov=fspack --cov-fail-under=95 --cov-report=term-missing

  # ===== 端到端（真实构建/运行）：独立 job，不计入主门禁 =====
  # 覆盖单测 mock 层无法验证的链路：真实镜像下载运行时与依赖、产物执行为冒烟、
  # 交叉构建 Windows 目标（Linux + mingw）、--lock/--frozen 端到端校验。
  # 这些用例均标记 e2e（多数同时 slow），主门禁 `-m "not slow"` 不会执行。
  e2e:
    name: E2E (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc mingw-w64

      # 运行时归档（standalone tarball）体积较大，缓存避免每次重新下载；
      # key 不含 release tag，升级 tag 后由 restore-keys 命中旧缓存再多下新文件。
      - name: Restore fspack runtime cache
        uses: actions/cache@v5
        with:
          path: ~/.fspack/cache
          key: fspack-runtime-${{ runner.os }}-${{ hashFiles('src/fspack/packaging/runtime/hashes.py') }}-${{ hashFiles('src/fspack/config/versions.py') }}
          restore-keys: |
            fspack-runtime-${{ runner.os }}-

      - name: Sync dependencies
        run: uv sync --frozen --extra test --python 3.11

      - name: Run e2e tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: uv run pytest -m e2e -v

  # ===== macOS 原生真实构建：arm64 + x86_64 双格，验证 Mach-O 产物 =====
  # 此前 macOS 目标只有单测（工具全 mock），从未有真实构建进过 CI。
  # 两格都在原生 runner 上构建并执行产物：macos-latest 为 arm64，
  # macos-15-intel 为标准 Intel runner（macos-13 已退役）。
  # 目标架构由宿主 platform.machine() 推导，产物命名与 verify 期望同源，
  # 不写死 arm64。失败即为真实缺陷，不得改为 mock/skip 绕过。
  e2e-macos:
    name: E2E (${{ matrix.runner }}, native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false

      - name: Set up Python 3.11
        run: uv python install 3.11

      # key 含 runner.arch：arm64 与 x86_64 的 standalone tarball 不同，
      # 共用缓存会串架构，必须按架构隔离。
      - name: Restore fspack runtime cache
        uses: actions/cache@v5
        with:
          path: ~/.fspack/cache
          key: fspack-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/fspack/packaging/runtime/hashes.py') }}-${{ hashFiles('src/fspack/config/versions.py') }}
          restore-keys: |
            fspack-runtime-${{ runner.os }}-${{ runner.arch }}-

      - name: Sync dependencies
        run: uv sync --frozen --extra test --python 3.11

      - name: Run macOS native e2e
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: uv run pytest -m e2e -v

  # ===== 性能基准监控：仅 push to main 触发，PR 不触发 =====
  # 运行 pytest-benchmark 基线测试，保存结果并与历史最佳基准对比。
  # 对比逻辑见 fspack.doctor.benchmark_compare：扫描所有历史 JSON，按测试名
  # 找最小 median 作为最佳基准，当前运行与最佳对比。
  # 按基线类别分组设阈值（iter-145）：确定性测试（mock sleep StdDev <1%）
  # 用 10% 严格阈值，I/O 抖动测试（build_perf StdDev 5-27%）用 25% 宽松阈值，
  # subprocess 测试（entry_startup StdDev 5-8%）用 15%。--threshold 25 仅作
  # 未匹配类别测试的全局兜底。系统性退化（多测试同步大幅退化）判定为机器
  # 负载波动不阻断 CI。
  benchmark:
    name: Benchmark gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # benchmark 与 lint 同跑 ubuntu，避免缓存写冲突，只读不写
          save-cache: false

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen --extra test --python 3.13

      # 基线缓存：按平台 + Python 版本分组，避免硬件差异导致误报
      # key 含 v2 后缀：rounds=10→20 调整后基线数据不兼容，用 v2 让旧缓存失效
      - name: Restore benchmark baseline
        uses: actions/cache@v5
        with:
          path: .benchmarks/
          key: benchmark-ubuntu-3.13-v2-${{ github.run_id }}
          restore-keys: |
            benchmark-ubuntu-3.13-v2-

      - name: Run benchmark tests
        run: |
          uv run pytest tests/test_perf_baseline.py tests/test_build_perf_baseline.py tests/test_nuitka_compile_baseline.py tests/test_wheel_download_baseline.py tests/test_entry_startup_baseline.py -m slow \
            --benchmark-only \
            --benchmark-save=main \
            --benchmark-min-rounds=20 \
            --benchmark-warmup=on \
            --benchmark-columns=median,min,mean,stddev

      # 与历史最佳基准对比（非上一次基线），median 超过最佳 25% 视为退化
      # 首次运行无历史基线时脚本输出"无 benchmark 结果可对比"并 exit 0
      - name: Compare against best baseline
        run: uv run fsp doctor --bench-compare --bench-threshold 25

      # if-no-files-found=ignore：首次运行（v2 缓存未命中）无历史基线时
      # .benchmarks/ 可能为空，此为正常情况，不报 warning
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: .benchmarks/
          if-no-files-found: ignore
          retention-days: 30
