name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen --extra lint

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Pyrefly check
        run: uv run pyrefly check

  # ===== 单元测试矩阵：ubuntu + windows × Python 3.8/3.14 =====
  # Windows 矩阵覆盖 Windows 路径处理、PATH 分隔符、注册表访问等平台特有逻辑
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      - name: Run tests
        env:
          # Windows 默认控制台编码（cp1252/cp936）无法编码中文日志字符，
          # _compat.py 的 CICompat.ensure_utf8_stdio 只重配置 pytest 捕获流，
          # pytest 回放失败输出到真实 stdout/stderr 时仍触发 UnicodeEncodeError。
          # 强制 UTF-8 确保 CI 日志与本地非交互终端均可正常输出中文。
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: uv run pytest -m "not slow" --cov=fspack --cov-fail-under=95 --cov-report=term-missing

  # ===== 性能基准监控：仅 push to main 触发，PR 不触发 =====
  # 运行 pytest-benchmark 基线测试，保存结果并与历史最佳基准对比。
  # 对比逻辑见 scripts/compare_benchmark.py：扫描所有历史 JSON，按测试名
  # 找最小 median 作为最佳基准，当前运行与最佳对比，median 超过最佳 25%
  # 视为退化（exit 1）。与上一次基线对比相比，最佳基准过滤了机器抖动导致的
  # 慢运行，减少误报。
  benchmark:
    name: Benchmark gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen --extra test --python 3.11

      # 基线缓存：按平台 + Python 版本分组，避免硬件差异导致误报
      # key 含 v2 后缀：rounds=10→20 调整后基线数据不兼容，用 v2 让旧缓存失效
      - name: Restore benchmark baseline
        uses: actions/cache@v5
        with:
          path: .benchmarks/
          key: benchmark-ubuntu-3.11-v2-${{ github.run_id }}
          restore-keys: |
            benchmark-ubuntu-3.11-v2-

      - name: Run benchmark tests
        run: |
          uv run pytest tests/test_perf_baseline.py tests/test_build_perf_baseline.py tests/test_nuitka_compile_baseline.py tests/test_wheel_download_baseline.py tests/test_entry_startup_baseline.py -m slow \
            --benchmark-only \
            --benchmark-save=main \
            --benchmark-min-rounds=20 \
            --benchmark-warmup=on \
            --benchmark-columns=median,min,mean,stddev

      # 与历史最佳基准对比（非上一次基线），median 超过最佳 25% 视为退化
      # 首次运行无历史基线时脚本输出"无 benchmark 结果可对比"并 exit 0
      - name: Compare against best baseline
        run: uv run python scripts/compare_benchmark.py --threshold 25

      # if-no-files-found=ignore：首次运行（v2 缓存未命中）无历史基线时
      # .benchmarks/ 可能为空，此为正常情况，不报 warning
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: .benchmarks/
          if-no-files-found: ignore
          retention-days: 30
