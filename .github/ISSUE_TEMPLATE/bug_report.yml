name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below.
        Providing as much detail as possible will help us fix the issue faster.
        If some items don't apply, feel free to skip them.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the bug
      placeholder: |
        1. Run `pip install fspack`
        2. Create a project with `fsp init test --template pyside6`
        3. Run `cd test && fsp b`
        4. Error appears...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: fspack should produce dist/test.exe

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: fsp b crashes with ImportError: ...

  - type: markdown
    attributes:
      value: |
        ## Environment

  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g., Windows 11, Ubuntu 24.04, macOS Sonoma
      placeholder: Windows 11

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: The Python version used
      placeholder: 3.13.14

  - type: input
    id: fspack-version
    attributes:
      label: fspack Version
      description: Run `fsp -V` to find your version
      placeholder: 0.6.7

  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: Paste relevant log output (use `fsp b -v` for verbose output)
      placeholder: |
        $ fsp b -v
        [INFO] Analyzing dependencies...
        [ERROR] Something failed: ...
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information, screenshots, or workarounds you've found
      placeholder: I found a workaround by...
