[project]
authors = [{ name = "gooker_young", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies    = [
    "rich>=13.0",
    "tomli>=1.2; python_version < '3.11'",
    "typing-extensions>=4.0; python_version < '3.13'",
]
description     = "极速 Python 项目打包器。"
license         = "MIT"
name            = "fspack"
readme          = "README.md"
requires-python = ">=3.8"
version         = "0.3.11"

[project.optional-dependencies]
dev = [
    "fspack[lint,test]",
    "prek>=0.4.5",
    "tox-uv>=1.13.1",
    "tox>=4.25.0",
]
docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
image = ["Pillow>=9.4.0"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = [
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
]

[project.scripts]
fspack = "fspack.cli:main"
fsp = "fspack.cli:main"

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv]
required-version = ">=0.5.0"

[tool.hatch.build.targets.wheel]
packages = ["src/fspack"]

[tool.hatch.build.targets.wheel.force-include]
"src/fspack/py.typed" = "fspack/py.typed"

[tool.hatch.build.targets.sdist]
# 排除开发内部目录与文件，仅保留源码分发必需内容（src/tests/docs + 配置 + README/LICENSE）
exclude = [
    ".benchmarks",        # 性能测试基线数据
    ".github",            # CI 工作流配置
    ".trae",              # 开发流程文档（rules/docs/req/skills）
    ".vscode",            # IDE 配置
    "templates",          # GitHub Actions 打包模板
    "Makefile",           # 开发脚本
    ".copier-answers.yml", # 项目模板生成记录
    ".python-version",    # pyenv 版本锁
    ".bumpversion.toml",  # 版本管理工具配置
    ".pre-commit-config.yaml", # pre-commit 钩子配置
    ".readthedocs.yaml",  # ReadTheDocs 托管配置
]

[tool.fspack]
# 自身打包配置：排除开发期模板与 GitHub Actions 模板，启用 .pyc 剥离优化
exclude = ["templates", ".trae"]
pyc_strip = true
no_site = true

[tool.fspack.entries]
fsp = "src/fspack/cli.py"
fspack = "src/fspack/cli.py"

[dependency-groups]
dev = ["fspack[dev,docs,image]"]
