[project]
authors = [{ name = "gookeryoung", email = "gooker_young@qq.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Installation/Setup",
    "Topic :: Utilities",
]

dependencies    = [
    "certifi>=2023.7.22",
    "pefile>=2024.8.26",
    "rich>=13.0",
    "tomli>=2.0; python_version<'3.11'",
    "typing_extensions>=4.4; python_version<'3.12'",
]
description     = "One-command Python packaging tool — build executables and installers."
license         = "MIT"
name            = "fspack"
readme          = "README.md"
requires-python = ">=3.10"
version         = "0.6.7"

[project.optional-dependencies]
dev   = ["fspack[lint,test]", "prek>=0.4.5", "tox-uv>=1.13.1", "tox>=4.25.0"]
docs  = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
image = ["Pillow>=9.4.0"]
lint  = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test  = ["pytest-benchmark>=4.0", "pytest-cov>=5.0.0", "pytest-html>=4.1.1", "pytest-xdist>=3.6.1", "pytest>=8.0.0"]

[project.scripts]
fspack = "fspack.cli:main"
fsp    = "fspack.cli:main"

[project.urls]
Documentation = "https://fspack.readthedocs.io/en/latest/"
Issues        = "https://github.com/gookeryoung/fspack/issues"
Repository    = "https://github.com/gookeryoung/fspack"

[[tool.uv.index]]
url     = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.uv]
required-version = ">=0.5.0"

[tool.hatch.build.targets.wheel]
packages = ["src/fspack"]

[tool.hatch.build.targets.wheel.force-include]
"src/fspack/py.typed" = "fspack/py.typed"

[tool.hatch.build.targets.sdist]
exclude = [
    ".*",        # 所有.开头的隐藏文件/目录
    "templates", # GitHub Actions 打包模板
    "Makefile",  # 开发辅助脚本
    "scripts",   # 开发工具脚本
]

[tool.fspack]
exclude   = [".trae"]
data-dirs = ["src/fspack/assets/templates", "src/fspack/assets/init_templates"]
pyc_strip = true
no_site   = true

[dependency-groups]
dev = ["fspack[dev,docs,image]"]
