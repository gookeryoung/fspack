[project]
authors = [ {name = "gookeryoung", email = "gooker_young@qq.com"} ]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Installation/Setup",
    "Topic :: Utilities"
]

dependencies = [
    "certifi>=2023.7.22",
    "pefile>=2024.8.26",
    "rich>=13.0",
    "tomli>=2.0; python_version<'3.11'",
    "typing_extensions>=4.4; python_version<'3.12'"
]
description = "One-command Python packaging tool — build executables and installers."
license = "MIT"
name = "fspack"
readme = "README.md"
requires-python = ">=3.8"
version = "0.7.1"

[project.optional-dependencies]
dev = [ "fspack[lint,test]", "prek>=0.4.5", "tox-uv>=1.13.1", "tox>=4.25.0" ]
docs = [
    "myst-parser>=3.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx>=8.0; python_version>='3.10'",
    "sphinx>=7.0; python_version<'3.10'"
]
image = [
    "Pillow>=11.0; python_version>='3.9'",
    "Pillow>=9.4.0; python_version<'3.9'"
]
lint = [
    # pyrefly 1.2+ 大幅收紧 strict 规则（implicit-any 等），属工具链升级范畴，
    # 与 3.8 兼容迁移无关；锁定 <1.2 保持 typecheck 行为不变
    "pyrefly>=1.1.1,<1.6",
    "ruff>=0.8.0"
]
test = [ "pytest-benchmark>=4.0", "pytest-cov>=5.0.0", "pytest-html>=4.1.1", "pytest-xdist>=3.6.1", "pytest>=8.0.0" ]

[project.scripts]
fsp    = "fspack.cli:main"
fspack = "fspack.cli:main"

[project.urls]
Documentation = "https://fspack.readthedocs.io/en/latest/"
Issues        = "https://github.com/gookeryoung/fspack/issues"
Repository    = "https://github.com/gookeryoung/fspack"

[[tool.uv.index]]
default = true
url     = "https://mirrors.aliyun.com/pypi/simple/"

[build-system]
build-backend = "hatchling.build"
requires      = [ "hatchling" ]

[tool.hatch.build.targets.wheel]
packages = [ "src/fspack" ]

[tool.hatch.build.targets.wheel.force-include]
"src/fspack/py.typed" = "fspack/py.typed"

[tool.hatch.build.targets.sdist]
exclude = [
    ".*",        # 所有.开头的隐藏文件/目录
    "templates", # GitHub Actions 打包模板
    "Makefile",  # 开发辅助脚本
    "scripts"    # 开发工具脚本
]

[tool.fspack]
data-dirs = [
    "src/fspack/resources/templates/doctor",
    "src/fspack/resources/templates/init",
    "src/fspack/resources/loader"       # C loader 源码资源，构建期读取
]
exclude = [ ".trae" ]
no_site = true
pyc_strip = true
python-versions = [
    "3.8",
    "3.9",
    "3.10",
    "3.11",
    "3.12",
    "3.13",
    "3.14"
]
slim-exclude = [
    "pygments/**",
    "pygments-*.dist-info/**",
    "markdown_it/**",
    "markdown_it_py-*.dist-info/**",
    "mdurl/**",
    "mdurl-*.dist-info/**"
]

[tool.pytest.ini_options]
markers = [
    "slow: 单测耗时超过 0.5 秒（主门禁用 -m \"not slow\" 排除）",
    "e2e: 真实构建/运行的端到端测试（联网/需编译器，独立 CI job 执行）",
]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Benchmarks are automatically disabled because xdist plugin is active",
    "ignore::SyntaxWarning:pluggy",
]

[tool.coverage.run]
branch = true
concurrency = ["thread"]
omit = ["tests/*"]
source = ["fspack"]

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
extend-exclude = ["docs", "examples", "template", "src/fspack/resources"]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
ignore = [
    "E501",    # line too long (handled by formatter)
    "PLC0415", # import should be at top-level (intentional for lazy imports)
    "PLR0915", # too many statements (intentional for complex methods)
    "PLR0917", # too many positional arguments (intentional, same rationale as PLR0913)
    "PLR2004", # magic value comparison
    "RUF001",  # ambiguous unicode characters in string
    "RUF002",  # ambiguous unicode characters in docstring
    "RUF003",  # ambiguous unicode characters in comment
    "RUF012",  # mutable class attributes (intentional for config)
    "SIM108",  # use ternary operator
    "UP045",   # Optional[X] → X | None 的运行时求值点（TypeVar bound/类型别名）3.8 不支持，写法统一不自动改写
]
select = [
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "PL",  # Pylint
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ARG001", "ARG002", "ARG003", "ARG005"]
"src/fspack/packaging/loader/compile.py" = ["ARG003", "PLR0913"]     # 抽象方法签名/平台占位参数、loader 编译 API 参数多
"src/fspack/packaging/runtime/download.py" = ["ARG003", "PLR0913"]   # RuntimeDownloader 抽象签名未被子类覆盖、公开下载 API 参数多
"src/fspack/slim/default.py" = ["ARG003"]                             # 抽象方法 match 兜底实现不区分包名
"src/fspack/ui/progress.py" = ["UP047"]                               # 保持 Python 3.10 兼容，不用 PEP 695 泛型语法
"src/fspack/packaging/installer/base.py" = ["UP047"]                 # 保持 Python 3.10 兼容，不用 PEP 695 泛型语法

[dependency-groups]
dev = [ "fspack[dev,docs,image]" ]
