[project]
authors = [{ name = "gooker_young", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies    = [
    "rich>=13.0",
    "tenacity>=8.0",
    "tomli>=1.2; python_version < '3.11'",
]
description     = "极速 Python 项目打包器。"
license         = "MIT"
name            = "fspack"
readme          = "README.md"
requires-python = ">=3.8"
version         = "0.4.10"

[project.optional-dependencies]
dev = [
    "fspack[lint,test]",
    "prek>=0.4.5",
    "tox-uv>=1.13.1",
    "tox>=4.25.0",
]
docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
image = ["Pillow>=9.4.0"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0", "typing-extensions>=4.0; python_version < '3.12'"]
test = [
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
]

[project.scripts]
fspack = "fspack.cli:main"
fsp = "fspack.cli:main"

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv]
required-version = ">=0.5.0"

[tool.hatch.build.targets.wheel]
packages = ["src/fspack"]

[tool.hatch.build.targets.wheel.force-include]
"src/fspack/py.typed" = "fspack/py.typed"

[tool.hatch.build.targets.sdist]
# 隐藏文件/目录默认全局排除：.开头的 10+ 类开发内部项统一拦截，避免新增隐藏项时漏排；
# 需保留的 sdist 隐藏配置（覆盖率/VCS 规则）见下方 force-include 白名单。
exclude = [
    ".*",       # 所有.开头的隐藏文件/目录（包括 .benchmarks/.github/.trae/.vscode 与
                # .copier-answers.yml/.python-version/.bumpversion.toml/.pre-commit-config.yaml/
                # .readthedocs.yaml 等开发工具配置）
    "templates",# GitHub Actions 打包模板（非 fsp init 模板；fsp 模板在 src/fspack/assets/）
    "Makefile", # 开发辅助脚本（sdist 用户不需要）
]

[tool.hatch.build.targets.sdist.force-include]
# sdist 隐藏文件白名单：对用户有价值的 .开头配置
# - .coveragerc：用户跑 sdist 内 pytest 时需要覆盖率阈值配置
# - .gitignore / .gitattributes：sdist 解压后仍可作为 git 工作目录子集使用
".coveragerc"    = ".coveragerc"
".gitignore"     = ".gitignore"
".gitattributes" = ".gitattributes"

[tool.fspack]
# 自身打包配置：排除开发期模板与 GitHub Actions 模板，启用 .pyc 剥离优化
exclude = [".trae"]
# 数据资源目录：原样保留 assets/templates 下完整项目模板（pyproject.toml/README.md/
# uv.lock/.python-version 等）与 assets/init_templates 下 fsp init 模板（template.toml +
# 含 $variable 占位符的源文件）。copy_source 跳过元数据/文档排除，pyc_strip 跳过其下
# .py 剥离。fsp doctor --test 与 fsp init 复制模板时需要这些文件齐全。
data-dirs = ["src/fspack/assets/templates", "src/fspack/assets/init_templates"]
pyc_strip = true
no_site = true

[tool.fspack.entries]
fsp = "src/fspack/cli.py"
fspack = "src/fspack/cli.py"

[dependency-groups]
dev = ["fspack[dev,docs,image]"]
