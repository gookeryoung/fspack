[project]
name = "$project_name"
version = "0.1.0"
description = "$description"
requires-python = ">=3.8,<3.12"

[tool.fspack]
# 构建默认值（CLI 标志可覆盖）
nuitka = false
pyc_strip = true
pyc_optimize = 2
no_site = false
no_pyc = false
no_stdlib_trim = true
ccache = false

# 图标（相对项目目录的路径，未设置时用默认 app.ico）
# icon = "assets/app.ico"

# 额外排除目录/文件模式（合并到内置排除规则）
exclude = ["tests", "docs", ".github"]

# 私有 PyPI 服务器（可选）
# extra-index-urls = ["https://pypi.example.com/simple"]
# find-links = ["./local-wheels"]

# Nuitka 编译的第三方包（可选，需配合 nuitka = true）
# nuitka_packages = ["numpy"]

# 多入口声明（推荐 [project.scripts]，PEP 621 标准，dotted module 自动解析 flat/src layout）
# [project.scripts]
# cli = "cli:main"
# gui = "gui:main"

# 可选：[tool.fspack.entries] 覆盖同名入口或补充打包专属入口（值为脚本相对路径）
# [tool.fspack.entries]
# debug = "debug.py"
