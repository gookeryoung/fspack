[project]
dependencies    = ["pygame>=2.5.0"]
description     = "pygame 俄罗斯方块：多模块实体/粒子动画结构，覆盖 3.8-3.12 运行时段与 pyc 剥离配置"
name            = "pygame_tetris"
readme          = "README.md"
requires-python = ">=3.8,<3.13"
version         = "0.1.12"

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.fspack]
pyc_strip = true
no_site = true