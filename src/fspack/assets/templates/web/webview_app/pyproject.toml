[project]
dependencies = [
    "cffi>=1.17.1",
    "cryptography>=46.0.3",
    "psutil>=7.2.0",
    "pyperclip>=1.11.0",
    "pythonnet>=3.0.5",
    "pywebview>=6.1",
    "win10toast>=0.9",
]
description = "一个基于pywebview的本地桌面应用示例"
name = "webview—app"
requires-python = ">=3.8"
version = "0.1.0"

[project.optional-dependencies]
all = [
    "pyinstaller>=6.0",
    "pywebview>=6.1",
    "win10toast>=0.9; sys_platform == 'win32'",
]
build = ["pyinstaller>=6.0"]
windows = ["win10toast>=0.9"]

[project.scripts]
webdemo = "webview_app.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# 自定义构建钩子
[tool.hatch.build.hooks.custom]
path = "hatch_build_hook.py"

[tool.hatch.build.targets.wheel]
exclude = [
    "src/webview_app/frontend/*.*",
    "src/webview_app/frontend/node_modules/*",
    "src/webview_app/frontend/public/*",
    "src/webview_app/frontend/src/*",
]
include = [
    "src/webview_app/**/*.py",
    "src/webview_app/frontend/deploy/**/*",
]
packages = ["src/webview_app"]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/webview_app/frontend/deploy/**/*",
    "src/webview_app/frontend/node_modules/**/*",
]
include = ["src/webview_app/**/*.py"]

