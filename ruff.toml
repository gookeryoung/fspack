extend-exclude = [
    "template", "docs", "examples",
    "src/fspack/assets/templates", "src/fspack/assets/init_templates",
    "_*.py", "_*.pyd", "_*.txt",  # 根目录临时调试脚本
]
line-length    = 120
target-version = "py313"

[lint]
ignore = [
    "E501",    # line too long (handled by formatter)
    "PLC0415", # import should be at top-level (intentional for lazy imports)
    "PLR0915", # too many statements (intentional for complex methods)
    "PLR2004", # magic value comparison
    "RUF001",  # ambiguous unicode characters in string
    "RUF002",  # ambiguous unicode characters in docstring
    "RUF003",  # ambiguous unicode characters in comment
    "RUF012",  # mutable class attributes (intentional for config)
    "SIM108",  # use ternary operator
    "UP047",   # generic function type parameters (PEP 695) — 项目需兼容 3.8+
]
select = [
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "PL",  # Pylint
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[lint.per-file-ignores]
"**/tests/**" = ["ARG001", "ARG002", "ARG003", "ARG005"]
"src/fspack/packaging/loader/compile.py" = ["ARG003", "PLR0913"]
"src/fspack/packaging/runtime/download.py" = ["ARG003", "PLR0913"]
"src/fspack/slim/default.py" = ["ARG003"]

