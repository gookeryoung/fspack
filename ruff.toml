extend-exclude = ["docs", "examples", "template", "src/fspack/assets"]
line-length    = 120
target-version = "py38"

[lint]
ignore = [
    "E501",    # line too long (handled by formatter)
    "PLC0415", # import should be at top-level (intentional for lazy imports)
    "PLR0915", # too many statements (intentional for complex methods)
    "PLR0917", # too many positional arguments (intentional, same rationale as PLR0913)
    "PLR2004", # magic value comparison
    "RUF001",  # ambiguous unicode characters in string
    "RUF002",  # ambiguous unicode characters in docstring
    "RUF003",  # ambiguous unicode characters in comment
    "RUF012",  # mutable class attributes (intentional for config)
    "SIM108",  # use ternary operator
    "UP045",
]
select = [
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "PL",  # Pylint
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[lint.per-file-ignores]
"**/tests/**" = ["ARG001", "ARG002", "ARG003", "ARG005"]
"src/fspack/packaging/loader/compile.py" = ["ARG003", "PLR0913"]     # 抽象方法签名/平台占位参数、loader 编译 API 参数多
"src/fspack/packaging/runtime/download.py" = ["ARG003", "PLR0913"]   # RuntimeDownloader 抽象签名未被子类覆盖、公开下载 API 参数多
"src/fspack/slim/default.py" = ["ARG003"]                             # 抽象方法 match 兜底实现不区分包名
"src/fspack/progress.py" = ["UP047"]                                 # 保持 Python 3.10 兼容，不用 PEP 695 泛型语法
"src/fspack/packaging/installer/base.py" = ["UP047"]                 # 保持 Python 3.10 兼容，不用 PEP 695 泛型语法
